<div class="container">
    <h2>Payment</h2>
    <form [formGroup]="form" (ngSubmit)="submit()">
            <label>Amount</label>
            <input type="number" formControlName="amount">
            <label>Card Number</label>
            <input type="text" formControlName="cardNumber">
        <button type="submit" class="btn btn-primary">Pay Now</button>
    </form>
</div>
