<div class="container">
    <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>

    <div *ngIf="hotel">
        <h2>{{hotel.name}}</h2>
        <p>{{hotel.location}}</p>
        <p>{{hotel.description}}</p>

        <h3>Available Rooms</h3>
        <p *ngIf="availableRooms.length === 0">No available rooms for this hotel.</p>
        <div *ngFor="let room of availableRooms" class="room-card">
            <p><b>Type:</b> {{ room.type }}</p>
            <p><b>Price:</b> ${{ room.price }}</p>

            <button
                type="button"
                [routerLink]="['/booking', room.id]"
                [disabled]="!room.available">
                {{ room.available ? 'Book Now' : 'Not Available' }}
            </button>
        </div>
    </div>
</div>
