<nav class="navbar">
    <div class="logo">Hotel Booking</div>

    <div class="links">
        <a routerLink="/">Home</a>
        <a routerLink="/search">Search</a>
        <a routerLink="/hotels">All Hotels</a>
        <a href="" (click)="$event.preventDefault(); goToMyBookings()">My Bookings</a>
        <div *ngIf="authService.isAuthenticated()" class="notifications">
            <button type="button" class="notification-button" (click)="toggleNotifications()">
                Notifications
                <span *ngIf="unreadCount > 0" class="badge">{{ unreadCount }}</span>
            </button>
            <div *ngIf="showNotifications" class="notification-menu">
                <div class="notification-header">
                    <strong>Notifications</strong>
                    <button type="button" *ngIf="unreadCount > 0" (click)="markAllAsRead()">Mark all read</button>
                </div>
                <p *ngIf="notifications.length === 0" class="empty-notifications">No notifications.</p>
                <button
                    type="button"
                    *ngFor="let notification of notifications"
                    class="notification-item"
                    [class.unread]="!notification.read"
                    [class.expanded]="expandedNotificationIds.has(notification.id)"
                    (click)="openNotification(notification)">
                    <span class="notification-title">{{ getNotificationTitle(notification) }}</span>
                    <small>{{ notification.createdAt | date:'short' }}</small>
                    <span
                        *ngIf="expandedNotificationIds.has(notification.id)"
                        class="notification-message">
                        {{ getNotificationMessage(notification) }}
                    </span>
                </button>
            </div>
        </div>
        <a *ngIf="authService.isAdmin()" routerLink="/admin/hotels">Manage Hotels</a>
        <a *ngIf="authService.isAdmin()" routerLink="/admin/rooms">Manage Rooms</a>
        <a *ngIf="!authService.isAuthenticated()" routerLink="/login">Login</a>
        <button *ngIf="authService.isAuthenticated()" type="button" (click)="logout()">Logout</button>
    </div>
</nav>
